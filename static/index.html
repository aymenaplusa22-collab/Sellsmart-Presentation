<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sell Smart</title>
<style>
:root{--bg:#f4f8f4;--card:#fff;--ink:#173322;--muted:#667568;--brand:#237a42;--brand2:#1b6135;--line:#dce6dd;--soft:#e9f4ec;--danger:#b34b42;--shadow:0 12px 35px rgba(25,63,38,.09);--radius:20px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7faf7,#edf5ee);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:20px}.nav{position:sticky;top:0;z-index:10;background:rgba(247,250,247,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.navin{max-width:1180px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logoMark{width:36px;height:36px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:white;font-weight:900}.navlinks{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}.btn.ghost{background:transparent;color:var(--ink)}.btn.light{background:var(--soft);color:var(--brand2)}.hero{padding:42px 0 22px}.heroGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:stretch}.hero h1{font-size:clamp(42px,6vw,72px);line-height:.98;margin:0 0 18px;letter-spacing:-.04em}.hero p{font-size:18px;color:var(--muted);max-width:650px;line-height:1.6}.badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--brand2);font-weight:800;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.heroCard{padding:28px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fff,#f0f7f1)}.heroStat{font-size:48px;font-weight:900;color:var(--brand)}.section{padding:18px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mini{padding:20px}.mini strong{display:block;font-size:30px;margin-top:8px}.mini span{color:var(--muted);font-size:13px}.auth{max-width:980px;margin:50px auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}.authSide{padding:30px;background:linear-gradient(145deg,#1d5e34,#2f8750);color:#fff}.authSide h2{font-size:38px;margin-top:0}.authForm{padding:28px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfb;outline:none}.field input:focus,.field select:focus{border-color:#8abd96;box-shadow:0 0 0 3px #e6f3e9}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:18px 0}.dashboardGrid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.panel{padding:22px}.panel h2{margin:0 0 4px}.muted{color:var(--muted)}.result{margin-top:20px;padding:22px;border-radius:18px;background:#f6faf6;border:1px solid var(--line)}.decision{font-size:34px;font-weight:900}.decision.store{color:var(--brand)}.decision.sell{color:#8a4b22}.decision.caution{color:#8b6b20}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric small{display:block;color:var(--muted)}.metric strong{display:block;margin-top:6px;font-size:18px}.list{padding-left:18px;color:var(--muted);line-height:1.7}.footer{padding:35px 0 60px;color:var(--muted);font-size:13px}.toast{position:fixed;right:18px;bottom:18px;background:#173322;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:30}.demoNote{padding:12px 14px;background:#fff7df;border:1px solid #edd9a0;border-radius:12px;color:#6b5724;font-size:13px}.profileGrid{display:grid;grid-template-columns:.7fr 1.3fr;gap:18px}.avatar{width:72px;height:72px;border-radius:22px;background:var(--soft);display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--brand)}
@media(max-width:900px){.heroGrid,.dashboardGrid,.auth,.profileGrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.hero{padding-top:28px}.hero h1{font-size:52px}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{padding:14px}.navin{padding:12px 14px}.navlinks .btn{padding:9px 10px}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.metrics{grid-template-columns:1fr}.hero h1{font-size:42px}.auth{margin:25px auto}.authSide{display:none}.panel,.authForm,.heroCard{padding:20px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const state={me:null,meta:null,view:'home',authMode:'login',result:null};
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('en-ET',{maximumFractionDigits:2}).format(Number(n)||0);
function toast(m){toastEl.textContent=m;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),2600)}
async function api(url,opt={}){const r=await fetch(url,opt);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||'Something went wrong');return data}
async function bootstrap(){state.meta=await api('/api/meta');const m=await api('/api/me');state.me=m.user;state.view=state.me?'dashboard':'home';render()}
function nav(){return `<div class="nav"><div class="navin"><div class="logo"><div class="logoMark">S</div>Sell Smart</div><div class="navlinks">${state.me?`<button class="btn ghost" onclick="go('dashboard')">Dashboard</button><button class="btn ghost" onclick="go('profile')">Profile</button><button class="btn light" onclick="logout()">Log out</button>`:`<button class="btn ghost" onclick="showAuth('login')">Log in</button><button class="btn primary" onclick="showAuth('signup')">Create account</button>`}</div></div></div>`}
function home(){return `<div class="wrap hero"><div class="heroGrid"><div><span class="badge">AI-powered wheat market guidance</span><h1>Know when to <span style="color:var(--brand)">sell smart.</span></h1><p>Sell Smart helps farmers compare selling now with storing and selling later using the existing trained decision system.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px"><button class="btn primary" onclick="showAuth('signup')">Start as a farmer</button><button class="btn light" onclick="showAuth('login')">I already have an account</button></div></div><div class="card heroCard"><div><div class="muted">Today's product flow</div><div class="heroStat">SELL / STORE</div><p>Enter your market, price, quantity and recent price history. The real decision artifact produces the recommendation.</p></div><div class="demoNote">No GPS needed for the presentation. Your saved Region, Zone and Woreda are used as your profile location.</div></div></div><div class="section"><div class="grid3"><div class="card mini"><span>Real AI backend</span><strong>✓</strong><div class="muted">Uses the authoritative joblib artifact</div></div><div class="card mini"><span>Farmer-first</span><strong>6</strong><div class="muted">Core screens for the presentation</div></div><div class="card mini"><span>Mobile ready</span><strong>24/7</strong><div class="muted">Works on phones, tablets and desktop</div></div></div></div></div>`}
function auth(){return `<div class="wrap"><div class="auth"><div class="card authSide"><div class="badge" style="background:rgba(255,255,255,.15);color:#fff">Sell Smart</div><h2>One account.<br>One clear decision.</h2><p>Save your location once, then use it for future predictions.</p><ul class="list" style="color:#eaf5ec"><li>Full name + contact</li><li>Region, Zone, Woreda</li><li>Real SELL / STORE result</li></ul></div><div class="card authForm"><div class="tabs"><button class="btn ${state.authMode==='login'?'primary':'light'} tab" onclick="showAuth('login')">Log in</button><button class="btn ${state.authMode==='signup'?'primary':'light'} tab" onclick="showAuth('signup')">Sign up</button></div>${state.authMode==='login'?loginForm():signupForm()}</div></div></div>`}
function loginForm(){return `<form onsubmit="login(event)"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Password</label><input name="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:18px">Log in</button><div class="muted" style="font-size:12px;margin-top:12px">Password reset email can be added after the presentation.</div></form>`}
function signupForm(){return `<form onsubmit="signup(event)"><div class="formGrid"><div class="field full"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone (optional)</label><input name="phone"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Region</label><select name="region"><option value="">Select region</option>${state.meta.regions.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Zone</label><input name="zone" placeholder="e.g. Jimma"></div><div class="field"><label>Woreda</label><input name="woreda" placeholder="e.g. Mana"></div></div><button class="btn primary" style="width:100%;margin-top:18px">Create my account</button></form>`}
function dashboard(){const u=state.me||{};return `<div class="wrap"><div class="topline"><div><div class="muted">Welcome back</div><h1 style="margin:4px 0">${esc(u.full_name||'Farmer')}</h1><div class="muted">${esc(u.region||'Location not set')} ${u.zone?'• '+esc(u.zone):''} ${u.woreda?'• '+esc(u.woreda):''}</div></div><button class="btn primary" onclick="document.getElementById('prediction').scrollIntoView({behavior:'smooth'})">Make prediction</button></div><div class="dashboardGrid"><div class="card panel" id="prediction"><h2>Sell or store?</h2><p class="muted">Your saved profile location can pre-fill the prediction. You may change the prediction location without changing your profile.</p>${predictionForm()}<div id="result">${state.result?resultCard():`<div class="result"><div class="muted">Your recommendation will appear here.</div><div style="margin-top:8px;font-weight:700">Use real market numbers before making a decision.</div></div>`}</div></div><div class="card panel"><h2>What Sell Smart checks</h2><div class="section"><div class="mini card" style="box-shadow:none"><span>1</span><strong style="font-size:20px">Future price</strong><div class="muted">Recent prices + market + region</div></div></div><div class="section"><div class="mini card" style="box-shadow:none"><span>2</span><strong style="font-size:20px">Storage loss</strong><div class="muted">Region-smoothed loss estimate</div></div></div><div class="section"><div class="mini card" style="box-shadow:none"><span>3</span><strong style="font-size:20px">Transport</strong><div class="muted">Current vs later value</div></div></div><div class="demoNote">The decision threshold is ${state.meta.threshold.toFixed(1)}%. The underlying model is kept on the server.</div></div></div></div>`}
function predictionForm(){const u=state.me||{};return `<form onsubmit="predict(event)" style="margin-top:18px"><div class="formGrid"><div class="field"><label>Market</label><select name="market" required>${state.meta.markets.map(x=>`<option ${x==='Ambo'?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Region</label><select name="region" required>${state.meta.regions.map(x=>`<option ${x===(u.region||'Oromia')?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Current price (ETB/tonne)</label><input name="current_price" type="number" value="30000" min="1" step="0.01" required></div><div class="field"><label>Quantity (tonnes)</label><input name="quantity" type="number" value="10" min="0.01" step="0.01" required></div><div class="field"><label>Price 1 month ago</label><input name="lag1" type="number" value="29500" min="0.01" step="0.01" required></div><div class="field"><label>Price 2 months ago</label><input name="lag2" type="number" value="29000" min="0.01" step="0.01" required></div><div class="field"><label>Price 3 months ago</label><input name="lag3" type="number" value="28500" min="0.01" step="0.01" required></div><div class="field"><label>Harvest (kg)</label><input name="harvest_kg" type="number" value="12000" min="1" required></div><div class="field"><label>Transport</label><select name="transport_mode"><option value="1">On foot / pack animal</option><option value="2" selected>Cart</option><option value="3">Vehicle</option></select></div><div class="field"><label>Storage cost (ETB/tonne)</label><input name="storage_cost_per_unit" type="number" value="0" min="0" step="0.01"></div></div><button class="btn primary" style="width:100%;margin-top:18px">Get recommendation</button></form>`}
function resultCard(){const r=state.result;const cls=r.decision==='STORE'?'store':r.decision==='SELL_NOW'?'sell':'caution';return `<div class="result"><div class="muted">Real model result</div><div class="decision ${cls}">${esc(r.decision.replace('_',' '))}</div><p style="font-size:16px;line-height:1.55">${esc(r.recommendation)}</p><div class="metrics"><div class="metric"><small>Current price</small><strong>${money(r.current_price)} ETB</strong></div><div class="metric"><small>Predicted price</small><strong>${money(r.predicted_price)} ETB</strong></div><div class="metric"><small>Storage loss</small><strong>${Number(r.expected_storage_loss_pct).toFixed(2)}%</strong></div><div class="metric"><small>Sell now value</small><strong>${money(r.sell_now_value)} ETB</strong></div><div class="metric"><small>Store then sell</small><strong>${money(r.store_then_sell_value)} ETB</strong></div><div class="metric"><small>Advantage</small><strong>${Number(r.expected_financial_advantage_pct).toFixed(2)}%</strong></div></div><div style="margin-top:16px"><strong>Why?</strong><ul class="list">${r.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`}
function profile(){const u=state.me||{};return `<div class="wrap"><div class="topline"><div><div class="muted">Account</div><h1 style="margin:4px 0">Your profile</h1></div><button class="btn ghost" onclick="go('dashboard')">Back to dashboard</button></div><div class="profileGrid"><div class="card panel"><div class="avatar">${esc((u.full_name||'F').charAt(0).toUpperCase())}</div><h2 style="margin:18px 0 5px">${esc(u.full_name)}</h2><div class="muted">${esc(u.email)}</div><div class="section"><div class="demoNote">Saved location is used to pre-fill your future predictions.</div></div></div><div class="card panel"><form onsubmit="saveProfile(event)"><div class="formGrid"><div class="field full"><label>Full name</label><input name="full_name" value="${esc(u.full_name)}" required></div><div class="field full"><label>Phone</label><input name="phone" value="${esc(u.phone||'')}"></div><div class="field"><label>Region</label><select name="region"><option value="">Select region</option>${state.meta.regions.map(x=>`<option ${x===u.region?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Zone</label><input name="zone" value="${esc(u.zone||'')}"></div><div class="field"><label>Woreda</label><input name="woreda" value="${esc(u.woreda||'')}"></div></div><button class="btn primary" style="margin-top:18px">Save profile</button></form></div></div></div>`}
function render(){app.innerHTML=nav()+(state.view==='home'?home():state.view==='auth'?auth():state.view==='dashboard'?dashboard():profile());}
function go(v){state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function showAuth(mode){state.authMode=mode;state.view='auth';render();window.scrollTo({top:0})}
async function signup(e){e.preventDefault();try{await api('/api/signup',{method:'POST',body:new FormData(e.target)});const m=await api('/api/me');state.me=m.user;state.view='dashboard';toast('Account created');render()}catch(err){toast(err.message)}}
async function login(e){e.preventDefault();try{await api('/api/login',{method:'POST',body:new FormData(e.target)});const m=await api('/api/me');state.me=m.user;state.view='dashboard';toast('Welcome back');render()}catch(err){toast(err.message)}}
async function logout(){await api('/api/logout',{method:'POST'});state.me=null;state.result=null;go('home');toast('Logged out')}
async function saveProfile(e){e.preventDefault();try{await api('/api/profile',{method:'PUT',body:new FormData(e.target)});const m=await api('/api/me');state.me=m.user;toast('Profile saved');render()}catch(err){toast(err.message)}}
async function predict(e){e.preventDefault();const f=new FormData(e.target);const body={current_price:Number(f.get('current_price')),quantity:Number(f.get('quantity')),market:f.get('market'),region:f.get('region'),lag1:Number(f.get('lag1')),lag2:Number(f.get('lag2')),lag3:Number(f.get('lag3')),harvest_kg:Number(f.get('harvest_kg')),transport_mode:Number(f.get('transport_mode')),storage_cost_per_unit:Number(f.get('storage_cost_per_unit')||0)};try{state.result=await api('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});render();document.getElementById('result').scrollIntoView({behavior:'smooth'});toast('Real prediction complete')}catch(err){toast(err.message)}}
bootstrap();
</script>
</body></html>
